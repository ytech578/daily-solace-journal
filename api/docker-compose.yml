version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: daily_solace_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dsj_user
      POSTGRES_PASSWORD: dsj_pass
      POSTGRES_DB: daily_solace
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: daily_solace_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dailysolace.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
